<style>
:root {
  --bg: #0A0A0A;
  --bg-2: #131316;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.1);
  --border-2: rgba(255,255,255,0.16);
  --text: #FAFAFA;

  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  font-size: 16px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.art-header {
  border-bottom: 1px solid var(--border);
  padding: 20px 24px;
  background: rgba(10,10,10,0.85);
  -webkit-backdrop-filter: blur(20px) saturate(150%);

  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.art-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
}
.art-logo svg { width: 32px; height: 32px; }
.art-logo-text {
  font-family: var(--font-display);

}
.art-logo-text .accent { color: var(--accent); }
.art-back {

  font-size: 0.92rem;

  background: var(--surface);
  border: 1px solid var(--border);
}

.art-content {
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}
.art-breadcrumbs {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 24px;
}
.art-breadcrumbs a { color: var(--text-muted); text-decoration: none; }
.art-breadcrumbs a:hover { color: var(--accent-2); }
.art-category-pill {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(16,185,129,0.15);
  border: 1px solid rgba(16,185,129,0.4);
  color: var(--accent-2);
  font-size: 0.78rem;
  font-weight: 600;

}
.art-title {

  font-size: clamp(2rem, 5vw, 3rem);

  letter-spacing: -0.03em;
  line-height: 1.1;

}
.art-meta {
  display: flex;
  gap: 16px;
  color: var(--text-muted);
  font-size: 0.88rem;
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.art-cover {
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 32px;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, #0d2a23, #022C22);
}
.art-cover img { width: 100%; height: 100%; object-fit: cover; }
.art-body {

}
.art-body h2 {

  font-size: 1.5rem;

  letter-spacing: -0.02em;

}
.art-body h3 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;

}
.art-body p { margin-bottom: 16px; }
.art-body ul, .art-body ol { margin-bottom: 16px; padding-left: 24px; }
.art-body li { margin-bottom: 8px; }
.art-body a { color: var(--accent-2); }
.art-body strong, .art-body b { color: var(--text); font-weight: 700; }
.art-body code {
  font-family: 'SF Mono', Menlo, monospace;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.9em;
}

/* CTA inside article */
.art-cta {
  margin: 40px 0;
  padding: 28px 24px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(16,185,129,0.14), rgba(0,0,0,0.3));
  border: 1px solid var(--border-2);
  text-align: center;
}
.art-cta h3 {
  font-family: var(--font-display);
  font-size: 1.4rem;
  color: var(--text);

}
.art-cta p { color: var(--text-muted); margin-bottom: 18px; }
.art-cta a {
  display: inline-flex;
  align-items: center;

  padding: 13px 24px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  color: #002417;
  text-decoration: none;
  font-weight: 700;
  box-shadow: 0 12px 28px -8px rgba(16,185,129,0.35);
}

.art-loading, .art-error {
  text-align: center;
  padding: 80px 24px;

}
.art-error h2 { color: var(--text); margin-bottom: 12px; font-family: var(--font-display); }

/* Footer */
.art-footer {
  max-width: 800px;
  margin: 60px auto 0;
  padding: 28px 0 32px;
  border-top: 1px solid var(--border);
}
.art-footer-inner {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.art-footer-nav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 0.85rem;
}
.art-footer-nav a {

  text-decoration: none;
}
.art-footer-nav a:hover { text-decoration: underline; }
.art-footer-sep { color: var(--text-muted); }
.art-footer-meta {

  gap: 4px;

  color: var(--text-muted);
}
.art-footer-note {
  font-size: 0.75rem;
  color: var(--text-muted);
  opacity: 0.8;
  line-height: 1.5;
}

/* ===== Related articles block ===== */
.art-related-block {
  margin: 48px 0 32px;
  padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.art-related-heading {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 20px;
  color: var(--text);
}
.art-related-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 640px) {
  .art-related-grid { grid-template-columns: repeat(3, 1fr); }
}
.art-related-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 14px;
  text-decoration: none;
  color: var(--text);
  transition: transform 0.18s, border-color 0.18s, background 0.18s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.art-related-card:hover {
  transform: translateY(-3px);
  border-color: rgba(52,211,153,0.35);
  background: rgba(255,255,255,0.05);
}
.art-related-cover {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 9px;
  background: rgba(0,0,0,0.3);
}
.art-related-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.art-related-cat {
  display: inline-block;
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent-2);
  font-weight: 600;
}
.art-related-title {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.3;
  margin: 0;
  color: var(--text);
}
.art-related-meta {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: auto;
}

/* ===== Расширенный CTA ===== */
.art-cta-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.art-cta-btn {
  flex: 1 1 200px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: 999px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.15s, box-shadow 0.15s;
  font-size: 0.95rem;
}
.art-cta-btn:hover { transform: translateY(-1px); }
.art-cta-btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #002417;
  box-shadow: 0 8px 24px rgba(16,185,129,0.3);
}
.art-cta-btn-primary:hover { box-shadow: 0 12px 32px rgba(16,185,129,0.45); }
.art-cta-btn-secondary {
  background: rgba(255,255,255,0.06);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.12);
}
.art-cta-btn-secondary:hover {
  border-color: rgba(52,211,153,0.4);
  background: rgba(52,211,153,0.08);
}

</header>

<main class="art-content" id="articleContent">

</main>

  <div class="art-footer-inner">
    <nav class="art-footer-nav" aria-label="Документы">
      <a href="docs/privacy.html">Политика конфиденциальности</a>

<script>
'use strict';

// Get slug from URL query param
function getSlug() {
  const params = new URLSearchParams(window.location.search);
  return params.get('slug');
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch (e) { return iso; }
}

async function loadArticle() {
  const slug = getSlug();
  const content = document.getElementById('articleContent');

  if (!slug) {
    content.innerHTML = `<div class="art-error">
      <h2>Статья не найдена</h2>
      <p>Не указан идентификатор статьи в адресе.</p>
      <a href="/#articles" class="art-back" style="margin-top:16px;display:inline-block;">← Все статьи</a>
    </div>`;
    return;
  }

  try {
    const res = await fetch('data/articles.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const articles = await res.json();
    const article = articles.find(a => a.slug === slug && a.published !== false);

    if (!article) {
      content.innerHTML = `<div class="art-error">
        <h2>Статья не найдена</h2>
        <p>Статья с идентификатором «${slug}» не найдена или не опубликована.</p>
        <a href="/#articles" class="art-back" style="margin-top:16px;display:inline-block;">← Все статьи</a>
      </div>`;
      return;
    }

    // Update page meta
    document.title = (article.seoTitle || article.title) + ' — POWER Car';
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', article.seoDescription || article.description || '');

    // Inject Article schema (Schema.org)
    const schema = {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": article.title,
      "description": article.description,
      "datePublished": article.publishedAt,
      "author": { "@type": "Organization", "name": article.author || "POWER Car" },
      "publisher": { "@type": "Organization", "name": "POWER Car" }
    };
    const schemaScript = document.createElement('script');
    schemaScript.type = 'application/ld+json';
    schemaScript.textContent = JSON.stringify(schema);
    document.head.appendChild(schemaScript);

    // Render
    const coverHtml = article.cover ? `<div class="art-cover"><img src="${article.cover}" alt="${article.title}"></div>` : '';

    // Связанные статьи: сначала из той же категории, потом просто свежие
    const others = articles.filter(a => a.slug !== article.slug && a.published !== false);
    const sameCategory = article.category ? others.filter(a => a.category === article.category) : [];
    const fresh = others.filter(a => !sameCategory.includes(a));
    const related = [...sameCategory, ...fresh].slice(0, 3);

    let relatedHtml = '';
    if (related.length > 0) {
      const cards = related.map(a => `
        <a class="art-related-card" href="/article.html?slug=${encodeURIComponent(a.slug)}">
          ${a.cover ? `<div class="art-related-cover"><img src="${a.cover}" alt="${a.title}" loading="lazy" decoding="async"></div>` : ''}
          ${a.category ? `<span class="art-related-cat">${a.category}</span>` : ''}
          <h4 class="art-related-title">${a.title}</h4>
          ${a.readTime ? `<span class="art-related-meta">⏱ ${a.readTime} мин</span>` : ''}
        </a>
      `).join('');
      relatedHtml = `
        <section class="art-related-block" aria-label="Связанные статьи">
          <h2 class="art-related-heading">Читайте также</h2>
          <div class="art-related-grid">${cards}</div>
        </section>
      `;
    }

    content.innerHTML = `
      <nav class="art-breadcrumbs">
        <a href="/">Главная</a> ›
        <a href="/#articles">Статьи</a> ›
        <span>${article.title}</span>
      </nav>
      ${article.category ? `<span class="art-category-pill">${article.category}</span>` : ''}
      <h1 class="art-title">${article.title}</h1>
      <div class="art-meta">
        <span>${fmtDate(article.publishedAt)}</span>
        ${article.readTime ? `<span>⏱ ${article.readTime} мин чтения</span>` : ''}
        ${article.author ? `<span>✍️ ${article.author}</span>` : ''}
      </div>
      ${coverHtml}
      <div class="art-body">${article.body || ''}</div>

      ${relatedHtml}

      <div class="art-cta">
        <h3>Готовы заказать авто из Азии?</h3>
        <p>Получите 3 варианта под ваш бюджет — бесплатно. Менеджер свяжется в течение рабочего дня.</p>
        <div class="art-cta-buttons">
          <a href="/#selector" class="art-cta-btn art-cta-btn-secondary">🔍 Подобрать авто</a>
          <a href="/#cta" class="art-cta-btn art-cta-btn-primary">Оставить заявку →</a>
        </div>
      </div>
    `;
  } catch (e) {
    console.error('Failed to load article:', e);
    content.innerHTML = `<div class="art-error">
      <h2>Не удалось загрузить статью</h2>
      <p>Проверьте соединение с интернетом или попробуйте позже.</p>
      <a href="/#articles" class="art-back" style="margin-top:16px;display:inline-block;">← Все статьи</a>
    </div>`;
  }
}

loadArticle();
</script>
