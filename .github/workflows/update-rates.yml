name: Update EUR rate (CBR)

# Раз в сутки подтягивает курс евро ЦБ РФ в data/settings.json (для расчёта таможенной пошлины в калькуляторах).
on:
  schedule:
    - cron: "30 4 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  eur:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch CBR EUR
        run: python3 scripts/update_eur.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/settings.json
          if git diff --staged --quiet; then
            echo "Курс не изменился."
          else
            git commit -m "chore: EUR rate from CBR [skip ci]"
            git pull --rebase origin main
            git push
          fi
