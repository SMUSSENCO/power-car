name: Build static pages

# Запускается автоматически при пуше, если изменились данные, генератор или шаблоны.
on:
  push:
    branches: [main]
    paths:
      - "data/cars.json"
      - "data/articles.json"
      - "scripts/build.py"
      - "article.html"
      - "car.html"
  workflow_dispatch: {}   # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write          # нужно, чтобы Action мог закоммитить сгенерированные страницы

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate static pages
        run: python3 scripts/build.py

      - name: Commit & push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles auto sitemap.xml
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен."
          else
            git commit -m "chore: regenerate static pages [skip ci]"
            git push
          fi
