<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет клиента | POWER Car</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src https://fonts.bunny.net; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png"><link rel="icon" type="image/png" sizes="120x120" href="/favicon-120x120.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
<link href="https://fonts.bunny.net/css?family=bricolage-grotesque:600,700|manrope:400,600,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0A0A0A;--surf:rgba(255,255,255,.04);--surf2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.16);--tx:#FAFAFA;--mut:rgba(255,255,255,.62);--dim:rgba(255,255,255,.42);--acc:#10B981;--acc2:#34D399;--soft:rgba(16,185,129,.12);--r:20px}
body{background:var(--bg);color:var(--tx);font-family:'Manrope',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.gh{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--bd)}
.gh-logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.15rem}.gh-logo b{color:var(--acc)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.9rem;border:1px solid var(--bd2);cursor:pointer}
.btn:hover{background:var(--surf2)}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 56px}
.hero{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.hero img{width:120px;height:90px;object-fit:cover;border-radius:14px;border:1px solid var(--bd);flex:none}
.eyebrow{color:var(--acc);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.15;margin:4px 0}
.meta{color:var(--mut);font-size:.93rem}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:16px}
.eta{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.eta .big{font-family:'Bricolage Grotesque',sans-serif;font-size:1.6rem;font-weight:700}
.eta .lbl{color:var(--dim);font-size:.82rem}
.bar{height:8px;border-radius:99px;background:var(--surf2);overflow:hidden;margin-top:14px;width:100%}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.map{width:100%;height:auto;display:block}
.map text{font-family:'Manrope',sans-serif;fill:var(--mut);font-size:var(--fs,21px);font-weight:600}
.map .city{fill:var(--tx)}
.map .grat{stroke:rgba(255,255,255,.07);stroke-dasharray:2 7;stroke-width:1.4;fill:none;vector-effect:non-scaling-stroke}
.map .rest{stroke:rgba(255,255,255,.25);stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round;fill:none;animation:flow 2.4s linear infinite}
.map .done{stroke:var(--acc);stroke-width:4;stroke-linecap:round;fill:none}
.map .pulse{fill:var(--acc);opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.2);opacity:0}}
.note-map{color:var(--dim);font-size:.78rem;margin-top:6px}
.tl{list-style:none;position:relative}
.tl li{position:relative;padding:0 0 22px 46px}
.tl li:last-child{padding-bottom:0}
.tl li:before{content:'';position:absolute;left:15px;top:30px;bottom:-2px;width:2px;background:var(--bd2)}
.tl li:last-child:before{display:none}
.tl li.done:before{background:var(--acc)}
.dot{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;border:2px solid var(--bd2);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--dim)}
.done .dot{background:var(--acc);border-color:var(--acc);color:#04130d}
.now .dot{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:ring 2s infinite}
@keyframes ring{70%{box-shadow:0 0 0 12px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.tl h3{font-size:1rem;line-height:1.3;padding-top:4px}
.tl .d{color:var(--mut);font-size:.88rem}
.tl .when{color:var(--dim);font-size:.82rem;margin-top:2px}
.now h3{color:var(--acc2)}
.tl .pub{margin-top:6px;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.88rem}
.future h3{color:var(--mut);font-weight:600}
.msg{text-align:center;padding:64px 16px}
.msg h2{font-family:'Bricolage Grotesque',sans-serif;font-size:1.4rem;margin-bottom:10px}
.msg p{color:var(--mut);max-width:46ch;margin:0 auto 18px}
.foot{color:var(--dim);font-size:.8rem;text-align:center;margin-top:26px}
.cab-head{margin-bottom:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.tab{flex:none;background:var(--surf);border:1px solid var(--bd2);color:var(--mut);border-radius:999px;padding:9px 16px;font:600 .88rem 'Manrope',sans-serif;cursor:pointer}
.tab[aria-selected=true]{background:var(--soft);border-color:var(--acc);color:var(--acc2)}
.sel-head h1{margin:6px 0}
.hint{color:var(--dim);font-size:.88rem;margin-top:10px;line-height:1.5}
.offers{display:grid;gap:14px;margin-bottom:16px}
.offer{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:150px 1fr;gap:6px 16px;align-items:start}
.offer.chosen{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.offer-img{width:150px;height:112px;object-fit:cover;border-radius:12px;background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--dim);font-weight:700}
.offer-info h3{font-size:1.02rem;line-height:1.3}
.offer .price{color:var(--acc2);font-weight:700;margin-top:4px}
.badge{display:inline-block;margin-top:4px;background:var(--acc);color:#04130d;font-size:.72rem;font-weight:800;border-radius:99px;padding:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{background:var(--surf2);border-radius:99px;padding:3px 10px;font-size:.78rem;color:var(--mut)}
.offer .pub{margin-top:8px;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.88rem}
.offer-more{grid-column:1/-1}.offer-more summary{cursor:pointer;color:var(--acc2);font-weight:600;font-size:.9rem;padding:6px 0}
.offer-detail p{color:var(--mut);line-height:1.65;margin:8px 0;font-size:.93rem}
.eq{list-style:none;columns:2;column-gap:20px;margin:10px 0}.eq li{position:relative;padding:5px 0 5px 20px;break-inside:avoid;font-size:.9rem}.eq li:before{content:'✓';position:absolute;left:0;color:var(--acc);font-weight:700}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:6px 0}.thumbs img{height:90px;border-radius:10px;flex:none}
.lnk{display:inline-block;margin-top:6px;color:var(--acc2);font-weight:600;font-size:.9rem}
.offer-act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.btn-max{background:linear-gradient(135deg,#6366F1,#8B5CF6);border-color:transparent;color:#fff}.btn-tg{background:linear-gradient(135deg,#2AABEE,#229ED9);border-color:transparent;color:#fff}
.offers-fold summary{cursor:pointer;font-weight:700}.offers-fold .offers{margin:14px 0 0}
.more-order{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surf);border:1px dashed var(--bd2);border-radius:var(--r);padding:14px 18px;margin-top:6px;color:var(--mut);font-size:.92rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1E222C;border:1px solid var(--acc);color:var(--tx);padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:560px){.offer{grid-template-columns:1fr}.offer-img{width:100%;height:190px}.eq{columns:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:520px){.hero img{width:92px;height:70px}.card{padding:14px}}
</style>
</head>
<body>
<header class="gh">
  <a href="/" class="gh-logo">POWER <b>Car</b></a>
  <a href="tel:+79138533305" class="btn">Позвонить</a>
</header>
<main class="wrap" id="app"><div class="msg"><p>Загружаем статус…</p></div></main>
<script src="/js/status-crypto.js"></script>
<script src="/js/status-model.js"></script>
<script src="/js/status.js"></script>
</body>
</html>
