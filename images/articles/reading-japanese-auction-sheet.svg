<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background-color: #0A0B0D;">
  <rect width="1200" height="630" fill="#0A0B0D" />
  
  <path d="M 0,150 L 1200,150 M 0,300 L 1200,300 M 0,450 L 1200,450 M 0,600 L 1200,600" stroke="#16181C" stroke-width="1.5" />
  <path d="M 150,0 L 150,630 M 300,0 L 300,630 M 450,0 L 450,630 M 600,0 L 600,630 M 750,0 L 750,630 M 900,0 L 900,630 M 1050,0 L 1050,630" stroke="#16181C" stroke-width="1.5" />
  
  <defs>
    <filter id="glow-10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="600" cy="180" r="90" fill="none" stroke="#16181C" stroke-width="2" />
  <circle cx="600" cy="180" r="120" fill="none" stroke="#22252A" stroke-width="1.5" stroke-dasharray="8 8" />
  
  <g transform="translate(545, 145)" filter="url(#glow-10)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="none" stroke="#00FF88" stroke-width="4" />
    <line x1="20" y1="20" x2="90" y2="20" stroke="#00FF88" stroke-width="3" />
    <line x1="20" y1="35" x2="90" y2="35" stroke="#00FF88" stroke-width="3" />
    <line x1="20" y1="50" x2="60" y2="50" stroke="#FF5E00" stroke-width="3" />
  </g>

  <text x="600" y="320" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="4">АНАЛИТИКА: АУКЦИОНЫ ЯПОНИИ</text>
  <text x="600" y="380" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">РАСШИФРОВКА АУКЦИОННОГО ЛИСТА</text>
  <text x="600" y="440" text-anchor="middle" fill="#FF5E00" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">ЗНАЧЕНИЯ ОТМЕТОК W1, W2, U1</text>
  
  <line x1="450" y1="475" x2="750" y2="475" stroke="#22252A" stroke-width="3" />

  <text x="600" y="515" text-anchor="middle" fill="#8E929A" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Подробный разбор кузовных дефектов и следов окраса деталей</text>
  <text x="600" y="545" text-anchor="middle" fill="#FF5E00" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Профессиональный перевод замечаний инспекторов в Японии</text>

  <text x="600" y="595" text-anchor="middle" fill="#4A4E57" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="3">POWER CAR</text>
</svg>
