<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <rect width="1200" height="630" fill="#0A0B0D" />
  
  <path d="M 0,150 L 1200,150 M 0,300 L 1200,300 M 0,450 L 1200,450 M 0,600 L 1200,600" stroke="#16181C" stroke-width="1" />
  <path d="M 200,0 L 200,630 M 400,0 L 400,630 M 600,0 L 600,630 M 800,0 L 800,630 M 1000,0 L 1000,630" stroke="#16181C" stroke-width="1" />
  
  <circle cx="950" cy="315" r="250" fill="none" stroke="#16181C" stroke-width="2" />
  <circle cx="950" cy="315" r="150" fill="none" stroke="#22252A" stroke-width="1.5" stroke-dasharray="10 15" />
  <circle cx="950" cy="315" r="50" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.3" />

  <g transform="translate(450, 190)" opacity="0.95">
    <defs>
      <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    
    <path d="M 50,150 
             C 100,130 180,75 250,55 
             C 320,35 440,30 490,45 
             C 540,60 590,110 620,135 
             C 635,145 645,150 655,150 
             L 660,165 
             C 610,165 100,165 50,165 
             Z" 
          fill="none" 
          stroke="#00FF88" 
          stroke-width="5" 
          filter="url(#neon-glow)" />
          
    <circle cx="180" cy="165" r="35" fill="#0A0B0D" stroke="#00FF88" stroke-width="3" />
    <circle cx="510" cy="165" r="35" fill="#0A0B0D" stroke="#00FF88" stroke-width="3" />
  </g>

  <text x="80" y="140" fill="#00FF88" font-family="'Inter', sans-serif" font-size="20" font-weight="800" letter-spacing="4">АНАЛИТИКА: ИМПОРТ И ТАМОЖЕННОЕ ПРАВО</text>
  
  <text x="80" y="220" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">МЯГКИЙ ГИБРИД (MHEV)</text>
  <text x="80" y="290" fill="#FF5E00" font-family="'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">ЛОВУШКА 160 Л.С.</text>
  
  <line x1="80" y1="350" x2="550" y2="350" stroke="#22252A" stroke-width="3" />

  <text x="80" y="405" fill="#8E929A" font-family="'Inter', sans-serif" font-size="20" font-weight="bold">Суммирование мощности ДВС и электромотора</text>
  <text x="80" y="445" fill="#8E929A" font-family="'Inter', sans-serif" font-size="20" font-weight="bold">Риск начисления коммерческого утильсбора</text>
  <text x="80" y="485" fill="#FF5E00" font-family="'Inter', sans-serif" font-size="20" font-weight="bold">Переплата в 2026 году: от 1,4 млн рублей</text>

  <text x="80" y="560" fill="#4A4E57" font-family="'Inter', sans-serif" font-size="22" font-weight="900" letter-spacing="3">POWER CAR</text>
</svg>
