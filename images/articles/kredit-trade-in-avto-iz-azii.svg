<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background-color: #0A0B0D;">
  <rect width="1200" height="630" fill="#0A0B0D" />

  <path d="M 0,150 L 1200,150 M 0,300 L 1200,300 M 0,450 L 1200,450 M 0,600 L 1200,600" stroke="#16181C" stroke-width="1.5" />
  <path d="M 150,0 L 150,630 M 300,0 L 300,630 M 450,0 L 450,630 M 600,0 L 600,630 M 750,0 L 750,630 M 900,0 L 900,630 M 1050,0 L 1050,630" stroke="#16181C" stroke-width="1.5" />

  <defs>
    <filter id="glow-credit" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <text x="600" y="110" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="4">ФИНАНСИРОВАНИЕ ИМПОРТА 2026</text>

  <g filter="url(#glow-credit)" font-family="system-ui, sans-serif" font-weight="800">
    <circle cx="420" cy="250" r="80" fill="none" stroke="#00FF88" stroke-width="2.5" />
    <text x="420" y="240" text-anchor="middle" fill="#FFFFFF" font-size="16">КРЕДИТ</text>
    <text x="420" y="264" text-anchor="middle" fill="#00FF88" font-size="14">10–21%</text>

    <circle cx="780" cy="250" r="80" fill="none" stroke="#FF5E00" stroke-width="2.5" stroke-dasharray="6 6" />
    <text x="780" y="240" text-anchor="middle" fill="#FFFFFF" font-size="16">ТРЕЙД-ИН</text>
    <text x="780" y="264" text-anchor="middle" fill="#FF5E00" font-size="14">−5…15%</text>
  </g>

  <text x="600" y="390" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">КРЕДИТ И ТРЕЙД-ИН</text>
  <text x="600" y="442" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" letter-spacing="-1">ПРИ ПОКУПКЕ АВТО ИЗ АЗИИ</text>

  <line x1="450" y1="475" x2="750" y2="475" stroke="#22252A" stroke-width="3" />

  <text x="600" y="520" text-anchor="middle" fill="#8A968E" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Как это работает на практике</text>
  <text x="600" y="575" text-anchor="middle" fill="#55645C" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2">POWER CAR</text>
</svg>
