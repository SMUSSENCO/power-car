<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background-color: #0A0B0D;">
  <rect width="1200" height="630" fill="#0A0B0D" />

  <path d="M 0,150 L 1200,150 M 0,300 L 1200,300 M 0,450 L 1200,450 M 0,600 L 1200,600" stroke="#16181C" stroke-width="1.5" />
  <path d="M 150,0 L 150,630 M 300,0 L 300,630 M 450,0 L 450,630 M 600,0 L 600,630 M 750,0 L 750,630 M 900,0 L 900,630 M 1050,0 L 1050,630" stroke="#16181C" stroke-width="1.5" />

  <defs>
    <filter id="glow-ev" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <text x="600" y="110" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="4">ЭЛЕКТРОКАРЫ ИЗ КИТАЯ 2026</text>

  <g filter="url(#glow-ev)" font-family="system-ui, sans-serif" font-weight="800">
    <rect x="500" y="195" width="200" height="110" rx="14" fill="none" stroke="#00FF88" stroke-width="2.5" />
    <text x="600" y="235" text-anchor="middle" fill="#FFFFFF" font-size="15">БАТАРЕЯ</text>
    <text x="600" y="262" text-anchor="middle" fill="#00FF88" font-size="13">8 лет / 160К км</text>
    <text x="600" y="285" text-anchor="middle" fill="#8A968E" font-size="11">SoH ≥ 70%</text>
  </g>
  <g font-family="system-ui, sans-serif" font-weight="700">
    <circle cx="330" cy="250" r="46" fill="none" stroke="#FF5E00" stroke-width="2.5" />
    <text x="330" y="245" text-anchor="middle" fill="#FFFFFF" font-size="13">ГЕО-</text>
    <text x="330" y="261" text-anchor="middle" fill="#FF5E00" font-size="13">ЛОК</text>
    <circle cx="870" cy="250" r="46" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6 6" />
    <text x="870" y="245" text-anchor="middle" fill="#FFFFFF" font-size="13">ГАРАН-</text>
    <text x="870" y="261" text-anchor="middle" fill="#8A968E" font-size="13">ТИЯ?</text>
  </g>

  <text x="600" y="385" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="-1">ГАРАНТИЯ НА ЭЛЕКТРОМОБИЛЬ</text>
  <text x="600" y="435" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">ИЗ КИТАЯ: ЧТО ПОКРЫВАЕТ ЗАВОД</text>

  <line x1="450" y1="465" x2="750" y2="465" stroke="#22252A" stroke-width="3" />

  <text x="600" y="510" text-anchor="middle" fill="#8A968E" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Zeekr · Voyah · Lixiang · BYD</text>
  <text x="600" y="575" text-anchor="middle" fill="#55645C" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2">POWER CAR</text>
</svg>
