  <line x1="535" y1="162" x2="665" y2="162" stroke="#00FF88" stroke-width="4" filter="url(#glow-4)" />
  <circle cx="570" cy="192" r="12" fill="#FF5E00" />
  <circle cx="590" cy="192" r="12" fill="#00FF88" opacity="0.8" />

  <text x="600" y="320" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="4">МЕЖДУНАРОДНЫЕ ТРАНЗАКЦИИ И ФИНАНСЫ</text>
