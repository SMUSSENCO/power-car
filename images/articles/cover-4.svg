  <text x="600" y="440" text-anchor="middle" fill="#FF5E00" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">БАНКОВСКИЙ КОМПЛАЕНС</text>
  
