<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background-color: #0A0B0D;">
  <rect width="1200" height="630" fill="#0A0B0D" />
  
  <path d="M 0,150 L 1200,150 M 0,300 L 1200,300 M 0,450 L 1200,450 M 0,600 L 1200,600" stroke="#16181C" stroke-width="1.5" />
  <path d="M 150,0 L 150,630 M 300,0 L 300,630 M 450,0 L 450,630 M 600,0 L 600,630 M 750,0 L 750,630 M 900,0 L 900,630 M 1050,0 L 1050,630" stroke="#16181C" stroke-width="1.5" />
  
  <defs>
    <filter id="glow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="600" cy="180" r="90" fill="none" stroke="#16181C" stroke-width="2" />
  <circle cx="600" cy="180" r="120" fill="none" stroke="#22252A" stroke-width="1.5" stroke-dasharray="8 8" />
  
  <g transform="translate(540, 140)" filter="url(#glow-3)">
    <circle cx="20" cy="40" r="18" fill="none" stroke="#00FF88" stroke-width="4" />
    <circle cx="100" cy="40" r="18" fill="none" stroke="#00FF88" stroke-width="4" />
    <path d="M 20,40 L 45,15 L 75,15 L 100,40 M 45,15 L 60,40 L 100,40" stroke="#00FF88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="65" y1="10" x2="80" y2="10" stroke="#FF5E00" stroke-width="4" stroke-linecap="round" />
  </g>

  <text x="600" y="320" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="4">ЭКСПОРТ ИЗ ЯПОНИИ: МОТОТЕХНИКА</text>
  <text x="600" y="380" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">МОТОЦИКЛЫ ИЗ ЯПОНИИ</text>
  <text x="600" y="440" text-anchor="middle" fill="#FF5E00" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">ИМПОРТ БЕЗ УТИЛЬСБОРА</text>
  
  <line x1="450" y1="475" x2="750" y2="475" stroke="#22252A" stroke-width="3" />

  <text x="600" y="515" text-anchor="middle" fill="#8E929A" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Полное освобождение от утилизационного сбора в РФ</text>
  <text x="600" y="545" text-anchor="middle" fill="#FF5E00" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Прямой выкуп лотов и транзитные схемы обхода санкций</text>

  <text x="600" y="595" text-anchor="middle" fill="#4A4E57" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="3">POWER CAR</text>
</svg>
