<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background-color: #0A0B0D;">
  <rect width="1200" height="630" fill="#0A0B0D" />
  
  <path d="M 0,150 L 1200,150 M 0,300 L 1200,300 M 0,450 L 1200,450 M 0,600 L 1200,600" stroke="#16181C" stroke-width="1.5" />
  <path d="M 150,0 L 150,630 M 300,0 L 300,630 M 450,0 L 450,630 M 600,0 L 600,630 M 750,0 L 750,630 M 900,0 L 900,630 M 1050,0 L 1050,630" stroke="#16181C" stroke-width="1.5" />
  
  <defs>
    <filter id="glow-5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="600" cy="180" r="90" fill="none" stroke="#16181C" stroke-width="2" />
  <circle cx="600" cy="180" r="120" fill="none" stroke="#22252A" stroke-width="1.5" stroke-dasharray="8 8" />
  <line x1="500" y1="180" x2="700" y2="180" stroke="#22252A" stroke-width="8" />
  <line x1="560" y1="180" x2="640" y2="180" stroke="#00FF88" stroke-width="12" filter="url(#glow-5)" />
  <circle cx="560" cy="180" r="14" fill="#FF5E00" />
  <circle cx="640" cy="180" r="14" fill="#FF5E00" />
  <text x="600" y="145" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" filter="url(#glow-5)">3-5 ЛЕТ</text>

  <text x="600" y="320" text-anchor="middle" fill="#00FF88" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="4">ТАРИФЫ И СТАВКИ: ТАМОЖЕННЫЙ СОЮЗ</text>
  <text x="600" y="380" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">ВЫГОДНЫЙ ВОЗРАСТ АВТО</text>
  <text x="600" y="440" text-anchor="middle" fill="#FF5E00" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">ПРОХОДНАЯ КАТЕГОРИЯ</text>
  
  <line x1="450" y1="475" x2="750" y2="475" stroke="#22252A" stroke-width="3" />

  <text x="600" y="515" text-anchor="middle" fill="#8E929A" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Расчет пошлины по фиксированной ставке за куб.см </text>
  <text x="600" y="545" text-anchor="middle" fill="#FF5E00" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Математическое сравнение пошлин разных категорий </text>

  <text x="600" y="595" text-anchor="middle" fill="#4A4E57" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="3">POWER CAR</text>
</svg>
